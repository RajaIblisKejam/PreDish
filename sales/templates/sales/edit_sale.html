{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 mt-10">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Edit Riwayat Penjualan</h1>
    <p class="text-gray-500 mb-6">Mengubah log penjualan <strong>{{ sale.menu_item.name }}</strong> untuk tanggal {{ sale.date|date:"d M Y" }}.</p>
    
    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Terjual (porsi)</label>
            <input type="number" name="terjual" value="{{ sale.qty_sold }}" min="0" required class="w-full border border-gray-300 rounded px-4 py-2 outline-none focus:border-primary">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Sisa (porsi)</label>
            <input type="number" name="sisa" value="{{ sisa }}" min="0" required class="w-full border border-gray-300 rounded px-4 py-2 outline-none focus:border-primary">
        </div>
        
        <div class="flex gap-3 mt-8">
            <button type="submit" class="bg-primary text-white font-medium px-6 py-2 rounded hover:bg-green-700 transition">Simpan Perubahan</button>
            <a href="{% url 'sales:history' %}" class="bg-gray-100 text-gray-700 font-medium px-6 py-2 rounded hover:bg-gray-200 transition">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
